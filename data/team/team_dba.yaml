      - '/oracle/software/product/12.1.0.2/grid_1/bin/acfsload'
      - '/oracle/software/product/12.1.0.2/grid_2/bin/acfsload'
      - '/oracle/software/product/12.1.0.2/grid_1/bin/crsctl'
      - '/oracle/software/product/12.1.0.2/grid_2/bin/crsctl'
      - '/oracle/software/product/12.2.0.1/grid_1/bin/acfsload'
      - '/oracle/software/product/12.2.0.1/grid_2/bin/acfsload'
      - '/oracle/software/product/12.2.0.1/grid_1/bin/crsctl'
      - '/oracle/software/product/12.2.0.1/grid_2/bin/crsctl'
      - '/oracle/puppet/scripts/unpack-grid-12.2.0.1.sh'
      - '/oracle/puppet/scripts/patch-grid-12.2.0.1.sh'
