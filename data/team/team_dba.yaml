    'oracle':
      - 'ALL'
    'root':
      - 'ALL'

# skip broken legacy ddboost ... 
team_linux::rsyslog_msgfilter:
  skip_ddboost3_5_1: "$msg contains 'Command exceeded timeout'"
  skip_ddboost3_5_2: "$msg contains '/Stage[main]/Team_dba::Profile::Ddboost3_5/Exec[ddboost_3_5_lockbox'"


team_linux::local0_filter:
  - 'Oracle Audit'

