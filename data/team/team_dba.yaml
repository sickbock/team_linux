########################################
# Default users and groups for the roles
# belonging to this team
########################################
team_linux::usergroups:
  dba:
  oinstall:

team_linux::localserviceaccounts:
  oracle:
  appsync:
#  ansible-dba:

team_linux::sudodefaults:
  appsync:
    - '!requiretty'
    - '!env_reset'

team_linux::ssh_forwarding: 'yes'

# W2008 1223 disable THP for all dba nodes
team_linux::disablethp: true

#team_linux::ssh_access:
#  - 'admslatinovic'
