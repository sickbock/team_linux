      - '/oraagent/agent13c/agent_13.4.0.0.0/perl/bin/perl'
      - '/oraagent/agent13c/agent_15.0.0.0.0/root.sh'
      - '/oraagent/agent13c/agent_15.0.0.0.0/sbin/nmosudo'
