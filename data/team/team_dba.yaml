  - 'admslatinovic'
  - 'admdgroot'
  - 'admraukes'
#  - 'admpbulk'        # Disabled op verzoek MW dd 20200820
  - 'admdhendriks'
  - 'admrbakker'
  - 'admramankoe'

# Sudo user for all nodes administered by the team
team_linux::team_dba_sudouser: 'oracle'

# sudo user per node role for the team - if any:
#team_linux::ebs_db_gridonly_sudouser: 'oracle'


team_linux::ssh_svcaccounts:
  - 'oracle'
  - 'appsync'
  - 'ansible-dba'


