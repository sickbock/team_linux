################################################################################
#  'Syncing Satellite subscriptions': |
#    When new products are added to the content host in Satellite, these
#    products may not be visisble even after running autoattach from
#    Satellite. But
#
#      subscription-manager refresh
#
#    will force the sync.
#  'Patching': |
#    To view applicable updates (with respect to the current content view
#    on Satellite):
#
#      yum updateinfo
#
#    To apply patches in the current Satellite content view
#
#      yum update
#

team_linux::netpeer_cron: true

