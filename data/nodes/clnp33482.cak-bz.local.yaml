---
team_linux::root_login: true
team_linux::pgsqlvers: '15'
team_linux::szpgsqldata: '35G'
team_linux::szpgsqlbackup: '55G'

team_linux::psqlnetaccess: true
team_linux::psqlmaxconnections: 1024

postgresql::server::ip_mask_deny_postgres_user: '0.0.0.0/32'

postgresql::server::role:
  'aapgwdb':
  'aapctrldb':
  'aaphubdb':
  'aapedadb':

postgresql::server::db:
  'aapgwdb':
    'user': 'aapgwdb'
  'aapctrldb':
    'user': 'aapctrldb'
  'aaphubdb':
    'user': 'aaphubdb'
  'aapedadb':
    'user': 'aapedadb'

postgresql::server::pg_hba_rule:
  'allow_aapgw1':
    description: 'PostgreSQL access from 172.25.168.145/32 to aapgwdb'
    type: 'host'
    database: 'aapgwdb,postgres'
    user: 'aapgwdb,postgres'
    address: '172.25.168.145/32'
    auth_method: 'md5'
  'allow_aapgw2':
    description: 'PostgreSQL access from 172.25.168.148/32 to aapgwdb'
    type: 'host'
    database: 'aapgwdb,postgres'
    user: 'aapgwdb,postgres'
    address: '172.25.168.148/32'
    auth_method: 'md5'
  'allow_aapctrl1':
    description: 'PostgreSQL access from 172.25.168.149/32 to aapctrldb'
    type: 'host'
    database: 'aapctrldb,postgres'
    user: 'aapctrldb,postgres'
    address: '172.25.168.149/32'
    auth_method: 'md5'
  'allow_aapctrl2':
    description: 'PostgreSQL access from 172.25.168.154/32 to aapctrldb'
    type: 'host'
    database: 'aapctrldb,postgres'
    user: 'aapctrldb,postgres'
    address: '172.25.168.154/32'
    auth_method: 'md5'
  'allow_aaphub1':
    description: 'PostgreSQL access from 172.25.168.144/32 to aaphubdb'
    type: 'host'
    database: 'aaphubdb,postgres'
    user: 'aaphubdb,postgres'
    address: '172.25.168.144/32'
    auth_method: 'md5'
  'allow_aaphub2':
    description: 'PostgreSQL access from 172.25.168.146/23 to aaphubdb'
    type: 'host'
    database: 'aaphubdb,postgres'
    user: 'aaphubdb,postgres'
    address: '172.25.168.146/32'
    auth_method: 'md5'
  'allow_aapeda1':
    description: 'PostgreSQL access from 172.25.168.147/32 to aapedadb'
    type: 'host'
    database: 'aapedadb,postgres'
    user: 'aapedadb,postgres'
    address: '172.25.168.147/32'
    auth_method: 'md5'
  'allow_aapeda2':
    description: 'PostgreSQL access from 172.25.168.150/32 to aapedadb'
    type: 'host'
    database: 'aapedadb,postgres'
    user: 'aapedadb,postgres'
    address: '172.25.168.150/32'
    auth_method: 'md5'
  'allow_zabbix': # test / monitor from Zabbix clnp33337.cak-bz.local
    description: 'PostgreSQL access from Zabbix 172.25.168.2/32 for awx'
    type: 'host'
    database: 'aapgwdb,aapctrldb,aaphubdb,aapedadb,postgres'
    user: 'aapgwdb,aapctrldb,aaphubdb,aapedadb,postgres'
    address: '172.25.168.2/32'
    auth_method: 'md5'
  'allow_localhost': # 
    description: 'PostgreSQL access from Zabbix 127.0.0.1/32'
    type: 'host'
    database: 'aapgwdb,aapctrldb,aaphubdb,aapedadb,postgres'
    user: 'aapgwdb,aapctrldb,aaphubdb,aapedadb,postgres'
    address: '127.0.0.1/32'
    auth_method: 'md5'
  'allow_clnp33482': # 
    description: 'PostgreSQL access from Zabbix 172.25.168.155/32'
    type: 'host'
    database: 'aapgwdb,aapctrldb,aaphubdb,aapedadb,postgres'
    user: 'aapgwdb,aapctrldb,aaphubdb,aapedadb,postgres'
    address: '172.25.168.155/32'
    auth_method: 'md5'

#team_linux::qualysthreads: '5'
 
