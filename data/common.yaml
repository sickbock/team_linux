---
#message: "This node is using Team Linux common data"
########################################
# Documentation
########################################
# see global common.yaml # team_linux::git_docurl: 'https://git.cak-bz.local/'
# bring the next parameter is in the team scope
team_linux::git_docurl: 'https://git.cak-bz.local'
team_linux::git_group: 'linuxbeheer'

########################################
# sudo parameter for serviceaccounts
#   To be removed when sudo.pp retires
########################################
team_linux::sudodefaults:
  zabbix:
    - '!requiretty'

########################################
# AD accounts + administrative privileges
# DO NOT USE FOR service/local account
########################################
team_linux::sudo_root:
  - 'admjpoutre'
  - 'admroostendorp'
  - 'admcarlo'
#  - 'sa-nessus-rap-linux' # obsolete, to be replaced by local reporter

########################################
# AD accounts with global SSH access
#   Also 'mortal' with key below:
#     "data for other remote users"
# DO NOT USE FOR service/local account
#   use team_linux::ssh_svcaccounts: 
########################################
#team_linux::ssh_access: # retire ssh_access for remaining native AD clients
#  - 'admmnolles'
#  - 'admthenczyk'
#  - 'admdvrouwenfelder'
##  - 'admrveenstra' # Disabled I2103 1670

########################################
# non-personal accounts go in here
# 'sa-nessus-scan-linux' now local acc.
# NEEDS TO BE MOVED TO IdM/IPA!
########################################
#team_linux::ssh_svcaccounts: 
##  - 'sa-nessus-scan-linux' # obsolete, no longer required
##  - 'sa-nessus-rap-linux' # to be replaced ....
#  - 'ansible-beheer' # to be moved to legacy.yaml or IdM
#  - 'qualysscan' # to be moved to legacy.yaml or IdM

########################################
# AD accounts with limited SSH access
# DO NOT USE FOR service/local account
########################################
team_linux::dba_ssh_access:
  - 'admslatinovic'
  - 'admdgroot'
  - 'admraukes'
  - 'admpbulk'
  - 'admdhendriks'
  - 'admrbakker'
  - 'admramankoe'

########################################
# Administrative privileges (not root)
#   ONLY RHEL6 & native AD clients
#   To be removed when sudo.pp retires
########################################
team_linux::sudocmd:
  '%emcadmin':
    'root':
      - '/bin/cat /var/log/messages'
      - '/sbin/pvdisplay'
      - '/sbin/vgdisplay'
      - '/sbin/lvdisplay'
      - '/usr/bin/lsscsi'
      - '/sbin/pgs'
      - '/sbin/vgs'
      - '/sbin/lgs'
# For Zabbix: system commands/scripts run from Zabbix GUI
#   for User Parameters see linuxbeheerscripts!
  'zabbix':
    'root':
      - '/sbin/aureport'
#      - '/usr/bin/yum updateinfo'
      - '/var/CAK/root/scripts/security'
      - '/var/CAK/root/scripts/fixsplunk.sh'
#      - '/usr/bin/yum -y -q --security check-update'
      - '/usr/lib/zabbix/externalscripts/puppetdisabled.sh'
      - '/usr/lib/zabbix/externalscripts/dsagentbroken.sh'
      - '/usr/sbin/subscription-manager status'
      - '/var/CAK/root/scripts/kerberos.sh'
#      - '/usr/sbin/ausearch -m USER_LOGIN -sv no -ts *'
      - '/usr/sbin/ausearch *'
      - '/usr/lib/zabbix/externalscripts/nodeinfo'
      - '/sbin/aureport -ts today -i -m --failed'
      - '/usr/bin/systemctl restart *'
      - '/usr/bin/journalctl --no-pager -xeu *'
      - '/usr/bin/dnf *' # clean all, check-update, ..
      - '/usr/bin/systemctl stop puppet'
      - '/usr/bin/rm -rf /etc/puppetlabs/puppet/ssl'
      - '/usr/local/bin/puppet agent -t'
      - '/usr/bin/rm /var/opt/ds_agent/am/core.*'
      - '/usr/lib/zabbix/externalscripts/unpackagedkernelmods.sh'
      - '/usr/local/qualys/cloud-agent/bin/qualys-healthcheck-tool'
      - '/usr/bin/pkill -9 -f /opt/ds_agent/ds_am'
      - '/usr/lib/zabbix/externalscripts/puppetdisabled.sh'
      - '/usr/bin/zabbix_check_puppetstate *'
      - '/usr/lib/zabbix/externalscripts/zabbix_check_puppetstate *'
      - '/usr/bin/stat -f -c *'
      - '/usr/bin/chronyc *'
      - '/opt/puppetlabs/bin/puppet agent -t'
  'sa-nessus-rap-linux':
    'root':
      - 'ALL'
  'ansible-beheer':
    'root':
      - 'ALL'
  'bofherd':
    'root':
      - 'ALL'
  'ALL':
    'root':
      - '/usr/local/bin/nodeinfo'

########################################
# Allow root login globally by default
# Replaced by "bofherd" with sudo rights
########################################
team_linux::root_login: false

########################################
# reporting etc. that needs ssh-root
########################################
team_linux::root_localservice_keys:
  - 'ssh-rsa  SA-NESSUS-RAP-LINUX@clnpmgt1'
  - 'ssh-rsa  admjpoutre'
  - 'ssh-rsa  admroostendorp'

########################################
# Network / servers
########################################
# IPA
team_linux::ipa_domainname: 'ipaprod.hetcak.nl'

# AD:
team_linux::ad_domain: 'CAK-BZ.LOCAL'
team_linux::ad_domainname: 'cak-bz.local'
team_linux::auth_servers:
  - '172.25.168.3'
  - '172.25.169.2'
  - '172.25.169.1'
  - '172.25.168.102'
  - '172.25.168.103'
  - '172.25.168.104'

team_linux::dns_servers:
  - '172.25.173.1'
  - '172.25.173.2'

team_linux::satellite_server: 'satellite.prd.sysmgt.func.cak-bz.local'
team_linux::satellite_organization: 'CAK'

# pool of NTP servers
team_linux::ntp_servers:
  - 'ntp1.cak-bz.local'
  - 'ntp2.cak-bz.local'
  - 'ntp3.cak-bz.local'

# default resolving options
team_linux::dns_search: 'cak-bz.local'
team_linux::dns_timeout: 1
team_linux::dns_attempts: 1
team_linux::dns_rotate: false

# Zabbix monitoring
team_linux::zabbix_old: false
team_linux::zabbix_agent: 'zabbix-agent2'
#team_linux::zabbix_ip: '172.25.168.32,172.25.168.2'
#team_linux::zabbix_url: 'clnp33051.cak-bz.local,clnp33337.cak-bz.local'
team_linux::zabbix_ip: '172.25.168.2'
team_linux::zabbix_url: 'clnp33337.cak-bz.local'

# RedHat Satellite
team_linux::satellite_server: 'satellite.prd.sysmgt.func.cak-bz.local'

# the proxy for internet access
# this is denied by the bluecoat unless explicitly allowed
# based on target url and requesting node - no user password
# managed by team infra
team_linux::proxy_server: 'cappbcsgx.inf.cak-bz.local'
team_linux::proxy_port: '8080'
team_linux::proxy_user: # authentication is handled on bluecoat
team_linux::proxy_password: # authentication is handled on bluecoat
team_linux::satellite_organization: 'CAK'

# Puppet
team_linux::puppetagent_runinterval: '900'

########################################
# the CAK Linux rsyslog and SIEM server
########################################
#team_linux::rsyslog_server: 'syslog.cak-bz.local'
team_linux::rsyslogserver: 'clnp32922.cak-bz.local'
team_linux::rsyslog_ip: '172.25.168.36'

# common rsyslog filters to stop messages being seen by zabbix
team_linux::rsyslog_msgfilter:
  skip_drive_cache_mode  : "$msg contains 'Assuming drive cache: write through'"
  skip_hrtimer_interrupt : "$msg contains 'hrtimer: interrupt took'"
  skip_init.ohasd : "$msg contains 'Starting execution of Oracle Clusterware init.ohasd'"



########################################
# Electronic mail and mail addresses
########################################
# Postfix default SMTP-relay
team_linux::smtp_relay: 'smtp.cak-bz.local'

# e-mail addresses
team_linux::linuxbeheer_mail   : 'linuxbeheer@hetcak.nl'
team_linux::tiso_mail          : 'tiso@hetcak.nl'
