########################################
# System mounts
#   default filesystem mounting options
########################################
team_linux::systemmounts:
  '/dev/system/root':
    mountpoint: '/'
    fstype    : 'ext4'
    fsoptions : 'noatime,discard,nobarrier'
  '/dev/system/home':
    mountpoint: '/home'
    fstype    : 'ext4'
    fsoptions : 'noatime,discard,nobarrier'
  '/dev/system/tmp':
    mountpoint: '/tmp'
    fstype    : 'ext4'
    fsoptions : 'noatime,discard,nobarrier'
  '/dev/system/var':
    mountpoint: '/var'
    fstype    : 'ext4'
    fsoptions : 'noatime,discard,nobarrier'
  '/dev/system/varlog':
    mountpoint: '/var/log'
    fstype    : 'ext4'
    fsoptions : 'noatime,discard,nobarrier'
  '/dev/system/varlogaudit':
    mountpoint: '/var/log/audit'
    fstype    : 'ext4'
    fsoptions : 'noatime,discard,nobarrier'


########################################
# Sysctl module: common kernel parameters
########################################
team_linux::sysctl:
  kernel.printk_ratelimit: 2
  kernel.printk_ratelimit_burst: 1000



########################################
# Global audit rules
########################################
team_linux::auditd_rules:
  'linux_000001':
    - '# prevent excessive sucessfull open/unlink logging for user root'
    - '-A never,exit -F arch=b64 -S open -S unlink -F uid=root -F success=1'
    - '-A never,exit -F arch=b32 -S open -S unlink -F uid=root -F success=1'
  'linux_000002':
    - '# prevent audit of failed unlink,readlink and open by user root (puppet file ensure => absent)'
    - '-A never,exit -F arch=b64 -S unlink -S readlink -S open -F uid=root -F success=0'
    - '-A never,exit -F arch=b32 -S unlink -S readlink -S open -F uid=root -F success=0'
#  'linux_000003': RHEL =< 7 only!
#    - '# do not audit succesull time adjustment by user ntp'
#    - '-A never,exit -F arch=b64 -S adjtimex -F uid=ntp -F success=1'
#    - '-A never,exit -F arch=b32 -S adjtimex -F uid=ntp -F success=1'
  'linux_000004':
    - '# do not generate audit failures on failed lgetxattr and getxattr'
    - '-A never,exit -F arch=b64 -S lgetxattr -S getxattr -F success=0'
    - '-A never,exit -F arch=b32 -S lgetxattr -S getxattr -F success=0'
  'linux_ansible-beheer':
    - '# do not audit actions by Ansible Automation like patching'
    - '-A never,exit -F uid=ansible-beheer'
  'linux_000005':
    - '# audit all read access to the audit log, excluding users root and zabbix'
    - '-w /var/log/audit/ -pr -F uid!=root -F uid!=zabbix -k LOG_audit -F success=1'
  'linux_000006':
    - '# audit all failed access to /var/log/audit/'
    - '-w /var/log/audit/ -k LOG_audit -F success=0'
  'linux_000007':
    - '# audit all access to the audit configuration'
    - '-w /etc/audit/ -p wa -k CFG_audit'
    - '-w /etc/sysconfig/auditd  -p wa -k CFG_auditd.conf'
    - '-w /etc/libaudit.conf -p wa -k CFG_libaudit.conf'
    - '-w /etc/audisp/ -p wa -k CFG_audisp'
  'linux_000008':
    - '# audit creation of special device files'
    - '-a always,exit -F arch=b32 -S mknod -S mknodat'
    - '-a always,exit -F arch=b64 -S mknod -S mknodat'
  'linux_000009':
    - '# audit mount and unmount operations'
    - '-a always,exit -F arch=b64 -S mount -S umount2'
    - '-a always,exit -F arch=b32 -S mount -S umount -S umount2'
# need to override, stime is no longer a system call since rhel 7
#  'linux_000010': # a bit silly, eventually replace by time out of sync Zabbix?
#    - '# audit time changes'
#    - '-a always,exit -F arch=b32 -S stime -S adjtimex -S settimeofday -k LOG_timeadjust'
#    - '-a always,exit -F arch=b64 -S stime -S adjtimex -S settimeofday -k LOG_timeadjust'
#    - '-a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k LOG_timeadjust'
#    - '-a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k LOG_timeadjust'
  'linux_000011':
    - '# audit cron config'
    - '-w /etc/cron.allow -p wa -k CFG_cron.allow'
    - '-w /etc/cron.deny -p wa -k CFG_cron.deny'
    - '-w /etc/cron.d/ -p wa -k CFG_cron.d'
    - '-w /etc/cron.daily/ -p wa -k CFG_cron.daily'
    - '-w /etc/cron.hourly/ -p wa -k CFG_cron.hourly'
    - '-w /etc/cron.monthly/ -p wa -k CFG_cron.monthly'
    - '-w /etc/cron.weekly/ -p wa -k CFG_cron.weekly'
    - '-w /etc/crontab -p wa -k CFG_crontab'
    - '-w /var/spool/cron/root -p wa -k CFG_crontab_root'
  'linux_000012':
    - '# auth files'
    - '-w /etc/group -p wa -k CFG_group'
    - '-w /etc/passwd -p wa -k CFG_passwd'
    - '-w /etc/gshadow -p wa -k CFG_gshadow'
    - '-w /etc/shadow -p wa -k CFG_shadow'
    - '-w /etc/security/opasswd -p wa -k CFG_opasswd'
  'linux_000013':
    - '# audit security logs'
    - '-w /etc/login.defs -p wa -k CFG_login.defs'
    - '-w /etc/securetty -p wa -k CFG_securetty'
    - '-w /var/run/faillock/ -p wa -k LOG_faillock'
    - '-w /var/log/lastlog -p wa -k LOG_lastlog'
    - '-w /var/log/tallylog -p wa -k LOG_tallylog'
    - '-w /var/run/utmp -p wa -k LOG_utmp'
    - '-w /var/log/btmp -p wa -k LOG_btmp'
    - '-w /var/log/wtmp -p wa -k LOG_wtmp'
  'linux_000014':
    - '# audit network config'
    - '-w /etc/hosts -p wa -k CFG_hosts'
    - '-w /etc/sysconfig/network -p wa -k CFG_network'
    - '-w /etc/sysconfig/network-scripts/ -p wa -k CFG_network'
    - '-w /etc/issue -p wa -k CFG_issue'
    - '-w /etc/issue.net -p wa -k CFG_issue.net'
    - '-a always,exit -F arch=b32 -S sethostname -S setdomainname -k CFG_hostdomain'
  'linux_000015':
    - '# audit init system'
    - '-w /etc/sysconfig/init -p wa -k CFG_init'
    - '-w /etc/init/ -p wa -k CFG_init'
    - '-w /etc/inittab -p wa -k CFG_inittab'
    - '-w /etc/rc.d/init.d/ -p wa -k CFG_initscripts'
  'linux_000016':
    - '# audit shared library search paths'
    - '-w /etc/ld.so.conf -p wa -k CFG_ld.so.conf'
  'linux_000017':
    - '# audit local time zone'
    - '-w /etc/localtime -p wa -k CFG_localtime'
  'linux_000018':
    - '# audit kernel parameters'
    - '-w /etc/sysctl.conf -p wa -k CFG_sysctl.conf'
  'linux_000019':
    - '# audit module configuration'
    - '-w /etc/modprobe.d/ -p wa -k CFG_modprobe'
    - '-a always,exit -F arch=b32 -S init_module -S delete_module -k CFG_modprobe'
    - '-a always,exit -F arch=b64 -S init_module -S delete_module -k CFG_modprobe'
    - '-w /sbin/insmod -p x -k CFG_modprobe'
    - '-w /sbin/rmmod -p x -k CFG_modprobe'
    - '-w /sbin/modprobe -p x -k CFG_modprobe'
  'linux_000020':
    - '# pam'
    - '-w /etc/pam.d/ -p wa -k CFG_pam'
    - '-w /etc/security/access.conf -p wa  -k CFG_pam'
    - '-w /etc/security/limits.conf -p wa  -k CFG_pam'
    - '-w /etc/security/pam_env.conf -p wa -k CFG_pam'
    - '-w /etc/security/namespace.conf -p wa -k CFG_pam'
    - '-w /etc/security/namespace.d/ -p wa -k CFG_pam'
    - '-w /etc/security/namespace.init -p wa -k CFG_pam'
    - '-w /etc/security/sepermit.conf -p wa -k CFG_pam'
    - '-w /etc/security/time.conf -p wa -k CFG_pam'
  'linux_000021':
    - '# audit postfix configuration'
    - '-w /etc/aliases -p wa -k CFG_aliases'
    - '-w /etc/postfix/ -p wa -k CFG_postfix'
  'linux_000022':
    - '# screen configuration'
    - '-w /etc/screenrc -p wa -k CFG_screen'
  'linux_000023':
    - '# audit ssh configuration'
    - '-w /etc/ssh/sshd_config -p wa -k CFG_sshd_config'
  'linux_000024':
    - '# audit SSSD configuration'
    - '-w /etc/sssd/sssd.conf -p wa -k CFG_sssd_config'
  'linux_000025':
    - '# audit sudoers'
    - '-w /etc/sudoers -p wa -k CFG_sudoers'
    - '-w /etc/sudoers.d/ -p wa -k CFG_sudoers'
  'linux_000026':
    - '# audit xinetd configuration'
    - '-w /etc/xinetd.d/ -p wax -k CFG_xinetd.d'
    - '-w /etc/xinetd.conf -p wax -k CFG_xinetd.conf'
  'linux_000027':
    - '# audit host domain modification'
    - '-a always,exit -F arch=b32 -S sethostname -S setdomainname'
    - '-a always,exit -F arch=b64 -S sethostname -S setdomainname'
  'linux_000028':
    - '# audit SELinux config'
    - '-w /etc/selinux/ -p wa -k MAC_policy'
  'linux_000029':
    - '# audit ssh and scp invocations'
    - '-w /usr/bin/ssh -p x -k SSH_invocation'
    - '-w /usr/bin/scp -p x -k SCP_invocation'
  'linux_aliases':
    - '# audit /etc/aliases.db:'
    - '-w /etc/aliases -p war -k watchaliases'
    - '-w /etc/aliases.db -p war -k watchaliasesdb'
  'linux_postfix':
    - '# audit postfix/postmap/sendmail:'
    - '-w /usr/sbin/postfix -p warx -k watchpostfix'
    - '-w /usr/sbin/postmap -p warx -k watchpostmap'
    - '-w /usr/sbin/sendmail.postfix -p warx -k watchsendmailpostfix'
    - '-w /usr/sbin/sendmail -p warx -k watchsendmail'

# zabbix user parameters / custom items for all nodes
team_linux::zabbix_userparams:
  custom.vmswap           : '/usr/bin/vmware-toolbox-cmd stat swap | cut -d\  -f 1'
  custom.vmballoon        : '/usr/bin/vmware-toolbox-cmd stat balloon | cut -d\  -f 1'
  #security_login   : 'sudo /sbin/aureport -ts recent -i -l --failed > /dev/null 2>&1 || { echo clean; $(exit 1); } && echo security_login'
  custom.security_login   : 'sudo /sbin/aureport -ts recent -i -l --failed | egrep ^[0-9] | egrep -v "172.25.168.12|172.24.166.243|172.24.166.244" |wc -l >/tmp/zabbixaureport ; [[ $(cat /tmp/zabbixaureport) -ne 0 ]] && echo security_login || echo clean'
  custom.security_account : 'sudo /sbin/aureport -ts recent -i -m --failed > /dev/null 2>&1 || { echo clean; $(exit 1); } && echo security_account'
  custom.security_file    : 'sudo /sbin/aureport -ts recent -i -f --failed > /dev/null 2>&1 || { echo clean; $(exit 1); } && echo security_file'
  custom.security_syscall : 'sudo /sbin/aureport -ts recent -i -s --failed > /dev/null 2>&1 || { echo clean; $(exit 1); } && echo security_syscall'
  custom.min_scsi_timeout : '/bin/cat $(ls -1 /sys/class/block/sd[a-z]*/device/timeout) | /bin/sort | /usr/bin/tail -n1'
  custom.audit_rate       : 'sudo /sbin/aureport -ts recent | grep "^Number of events" | cut -d\: -f2'
  custom.audit_fail_rate  : "sudo /sbin/aureport -ts recent | grep failed | awk -F\\: '{sum += $2} END {print sum}'"
  custom.iops_total       : "egrep 'sd[a-z]+ ' /proc/diskstats | awk '{sum = sum + $4 + $8} END {print sum}'"
#  custom.rx_bytes         : "egrep '(eth[0-9]+|ens[0-9]+|eno[0-9]+|enp[0-9]+s[0-9]+)' /proc/net/dev | awk '{sum = sum + $2} END {print sum}'"
#  custom.tx_bytes         : "egrep '(eth[0-9]+|ens[0-9]+|eno[0-9]+|enp[0-9]+s[0-9]+)' /proc/net/dev | awk '{sum = sum + $10} END {print sum}'"
  custom.activemem        : "grep 'Active:' /proc/meminfo | awk '{print $2 * 1024}'"
  custom.majorfaults      : "grep majfault /proc/vmstat | awk '{print $2}'"
  custom.commitas         : "grep Committed_AS /proc/meminfo | awk '{print $2 * 1024}'"
  custom.ldsoconf         : '/usr/lib/zabbix/externalscripts/check_ld.so.conf.sh'
  custom.yumrepos         : "echo $(cd /etc/yum.repos.d/ && egrep -r '^metalink|^baseurl' * 2>&1|egrep -v 'cak-bz.local|hetcak.nl|gitlab.com|fedoraproject.org|redhat.com|zabbix.com|puppetlabs|nam.repo'|sed -e 's/.*grep://;s/: Permission/ Permission/'|cut -d: -f1|egrep -v 'ansible|automation-platform|posit-pro')"

